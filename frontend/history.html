<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run History &amp; Comparison - API Integration Platform</title>

  <script>
    try {
      var theme = localStorage.getItem('app_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>

  <div class="app-viewport">
    
    <!-- ==========================================================================
         TOP BAR: HOME RETURN & TITLE BADGE
         ========================================================================== -->
    <header class="history-top-bar">
      <!-- Left: Home Return Button -->
      <a href="index.html?from=history" class="btn-home-circle" title="Return to Homepage">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
      </a>

      <!-- Center: Title Stadium Pill -->
      <div class="history-badge-pill">
        <span>RUN HISTORY</span>
      </div>

      <!-- Right: Theme Mode Toggle Button -->
      <div class="header-theme-toggle-wrap">
        <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle Light and Dark Mode" title="Toggle Theme (Light / Dark)">
          <span class="theme-toggle-pill">
            <span class="theme-icon-slot theme-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            </span>
            <span class="theme-icon-slot theme-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </span>
            <span class="theme-toggle-thumb"></span>
          </span>
          <span class="theme-toggle-text">LIGHT</span>
        </button>
      </div>
    </header>

    <!-- ==========================================================================
         MAIN LAYOUT: RUN LOGS & A/B COMPARATOR
         ========================================================================== -->
    <main class="history-layout">
      
      <!-- Left: Historical Runs List Card -->
      <section class="history-logs-card glass-card">
        <div class="history-card-header">
          <span>Execution Runs</span>
          <div class="history-source-tabs">
            <button id="tabBackend" class="history-tab-btn active" type="button">Backend Records</button>
            <button id="tabLocal" class="history-tab-btn" type="button">Local Runs</button>
          </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="history-toolbar">
          <div class="history-search-box">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
            </svg>
            <input type="text" id="historySearchInput" placeholder="Search by name, message, ID..." autocomplete="off">
            <button id="clearSearchBtn" class="clear-search-btn" type="button" title="Clear search" style="display:none;">&times;</button>
          </div>
          <div class="history-filter-group">
            <select id="statusFilter" class="history-filter-select" title="Filter by status">
              <option value="all">All Status</option>
              <option value="success">Success / Pass</option>
              <option value="failure">Failure / Fail</option>
            </select>
            <select id="modeFilter" class="history-filter-select" title="Filter by test mode">
              <option value="all">All Modes</option>
              <option value="CONCURRENCY">Concurrency</option>
              <option value="FUZZY">Fuzzy</option>
              <option value="SEQUENCE">Sequence</option>
            </select>
          </div>
        </div>

        <div id="historyList" class="history-scrollable-list custom-scrollable">
          <!-- Dynamically populated by history.js -->
        </div>

        <!-- Backend Pagination Footer (visible when Backend tab is active) -->
        <div id="historyPagination" class="history-pagination-bar" style="display: none;">
          <button id="btnPrevPage" class="pagination-btn" type="button">&larr; Prev</button>
          <input type="range" id="pageSlider" class="page-slider" min="1" max="1" value="1" step="1" title="Jump to page">
          <span id="pageIndicator" class="pagination-indicator">Page 1 of 1</span>
          <button id="btnNextPage" class="pagination-btn" type="button">Next &rarr;</button>
        </div>
      </section>

      <!-- Right: A/B Run Comparator Card -->
      <section class="history-compare-card glass-card">
        <div class="history-card-header">
          <span>A/B Run Comparator</span>
          <span style="font-family: monospace; font-size: 11px; color: #0A6563;">Performance Deltas</span>
        </div>

        <div class="compare-scrollable-body custom-scrollable">
          <!-- Selectors -->
          <div class="comparator-selectors-row">
            <div class="comparator-select-group">
              <label for="selectRunA">Baseline (Run A):</label>
              <select id="selectRunA" class="comparator-select"></select>
            </div>
            <div class="comparator-select-group">
              <label for="selectRunB">Comparison (Run B):</label>
              <select id="selectRunB" class="comparator-select"></select>
            </div>
          </div>

          <!-- Calculated Deltas Grid -->
          <div class="deltas-grid">
            <div class="delta-card">
              <span class="delta-label">&Delta; Avg Latency</span>
              <div id="deltaLatency" class="delta-value">0ms</div>
            </div>
            <div class="delta-card">
              <span class="delta-label">&Delta; Success Rate</span>
              <div id="deltaSuccess" class="delta-value">0%</div>
            </div>
            <div class="delta-card">
              <span class="delta-label">&Delta; Total Requests</span>
              <div id="deltaRequests" class="delta-value">0 reqs</div>
            </div>
            <div class="delta-card">
              <span class="delta-label">&Delta; Error Count</span>
              <div id="deltaErrors" class="delta-value">0 errors</div>
            </div>
          </div>

          <!-- Action Button -->
          <button id="btnOpenResult" class="btn-open-in-results" title="Open selected baseline run in full Results &amp; Metrics dashboard">
            Open Baseline in Results &gt;
          </button>
        </div>
      </section>

    </main>

  </div>

  <!-- Mounting Container for Notice, Error, and Success Info Boxes -->
  <div id="infoBoxContainer"></div>

  <script src="js/global.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
