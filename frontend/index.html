          <div class="header-right">
            <button id="btnFormat" class="action-pill-btn btn-format" title="Format JSON with 2-space indentation">FORMAT</button>
          </div>
        </div>

        <!-- Scrollable Body (Only this inner div has a scrollbar) -->
        <div id="jsonAreaScrollable" class="custom-scrollable">
          
          <!-- Mode 1: Manual Code Editor -->
          <div id="manualView" class="manual-editor-view">
            <textarea id="manualJsonTextarea" class="manual-textarea" spellcheck="false" placeholder="Enter or paste your raw JSON payload here..."></textarea>
            <div class="editor-status-bar">
              <span id="syntaxBadge" class="syntax-badge valid">● Valid JSON</span>
              <span style="color: #666;">Tab key inserts 2 spaces • Live validated</span>
            </div>
          </div>

          <!-- Mode 2: Format Chain Builder (<> CHAIN) -->
          <div id="chainView" class="chain-editor-view" style="display: none;">
            <div class="chain-bracket-wrap">
              <div class="chain-head-bracket">
                <button id="btnMainFold" class="btn-bracket-icon" title="Fold / Unfold Entire JSON Root">&lt;&gt;</button>
                <span>{</span>
              </div>
              <div id="chainBody" class="chain-body">
                <!-- Dynamically rendered .kv-row items with stadium capsules -->
              </div>
              <div class="chain-controls-bar">
                <button id="btnAddPair" class="btn-chain-action">+ Add Key-Value Pair</button>
                <button id="btnAddBranch" class="btn-chain-action">&lt;&gt; + Add Branch</button>
              </div>
              <div class="chain-foot-bracket">
                <span>}</span>
              </div>
            </div>
          </div>

        </div>

        <!-- Card Footer -->
        <div class="json-card-footer">
          <div class="target-endpoint-badge">
            <span>Target Route:</span>
            <span id="targetEndpointBadge" class="endpoint-pill">/api/concurrencetest</span>
          </div>
          <button id="btnPaste" class="action-pill-btn btn-paste" title="Paste clipboard payload">PASTE</button>
        </div>
      </section>

      <!-- Right Column: Action Buttons -->
      <aside class="right-action-column">
        <button id="btnRun" class="action-pill-btn btn-run" title="Execute test against backend">RUN</button>
        
        <a id="btnResult" href="result.html" class="action-pill-btn btn-result" title="Inspect latest execution results">
          <span>RESULT</span>
          <span id="resultBadge" class="notification-badge" style="display: none;">1</span>
        </a>
        
        <a id="btnHistory" href="history.html" class="action-pill-btn btn-history" title="View historical runs and compare">
          <span>HISTORY</span>
        </a>
        
        <a id="btnEditor" href="jsoneditor.html" class="action-pill-btn btn-editor" title="Open full-screen JSON Notepad with Auto Fix">
          <span>EDITOR</span>
        </a>
      </aside>

    </main>

  </div>

  <!-- Mounting Container for Notice, Error, and Success Info Boxes -->
  <div id="infoBoxContainer"></div>

  <script src="js/global.js"></script>
  <script src="js/homepage.js"></script>
</body>
</html>
