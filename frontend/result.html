<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results & Metrics - API Integration Platform</title>

  <script>
    try {
      var theme = localStorage.getItem('app_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/result.css">
</head>
<body>

  <div class="app-viewport">
    
    <!-- ==========================================================================
         TOP BAR: HOME RETURN, CONNECTED NODE CHAIN, TITLE BADGE
         ========================================================================== -->
    <header class="result-top-bar">
      <!-- Left: Home Return Button & Theme Toggle -->
      <div class="result-top-left-group">
        <a href="index.html?from=result" class="btn-home-circle" title="Return to Homepage">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
          </svg>
        </a>
        <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle Light and Dark Mode" title="Toggle Theme (Light / Dark)">
          <span class="theme-toggle-pill">
            <span class="theme-icon-slot theme-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            </span>
            <span class="theme-icon-slot theme-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </span>
            <span class="theme-toggle-thumb"></span>
          </span>
          <span class="theme-toggle-text">LIGHT</span>
        </button>
      </div>

      <!-- Center: Curved Bezier Node Chain (CONCURRENCY ~ FUZZY ~ SEQUENCE) -->
      <svg class="node-chain-svg" viewBox="100 10 440 60">
        <!-- Connecting Curved White Arcs -->
        <path d="M 195 38 C 218 42, 238 48, 258 50" class="node-connector-line" />
        <path d="M 358 50 C 378 48, 398 42, 420 38" class="node-connector-line" />

        <!-- Node 1: CONCURRENCY -->
        <g class="node-pill-group active" data-mode="CONCURRENCY">
          <rect x="110" y="16" width="115" height="42" rx="21" fill="#73412A" stroke="#67752C" stroke-width="3" />
          <text x="167" y="38">CONCURRENCY</text>
        </g>

        <!-- Node 2: FUZZY -->
        <g class="node-pill-group" data-mode="FUZZY">
          <rect x="250" y="28" width="115" height="42" rx="21" fill="#2A6B73" stroke="#753B2C" stroke-width="3" />
          <text x="307" y="50">FUZZY</text>
        </g>

        <!-- Node 3: SEQUENCE -->
        <g class="node-pill-group" data-mode="SEQUENCE">
          <rect x="390" y="16" width="115" height="42" rx="21" fill="#542A73" stroke="#2C754E" stroke-width="3" />
          <text x="447" y="38">SEQUENCE</text>
        </g>
      </svg>

      <!-- Right: Title Stadium Pill -->
      <div class="result-badge-pill">
        <span>RESULTS &amp; METRIC</span>
      </div>
    </header>

    <!-- ==========================================================================
         MAIN RESULTS GRID (VISUALIZER + AVAILABLE METRICS SIDEBAR)
         ========================================================================== -->
    <main class="result-layout">
      
      <!-- Left/Center: Dynamic Results Display Card -->
      <section id="resultDisplayCard" class="result-display-card glass-card">
        <div id="resultVisualizerBody" class="result-scrollable-body custom-scrollable">
          <!-- Dynamically populated by result.js depending on active metric tab -->
        </div>
      </section>

      <!-- Right Side: Available Metrics Sidebar -->
      <aside class="available-metrics-card">
        <div class="available-metrics-header">
          <span>AVAILABLE METRICS</span>
          <button id="btnToggleMetricNotice" class="btn-sidebar-info" type="button" title="Toggle metric explanation">Info</button>
        </div>
        
        <div id="availableMetricsScrollable" class="available-metrics-list">
          <!-- Metric 1: Executive Verdict & KPIs -->
          <button class="btn-metric-item verdict active" data-metric="verdict" title="Primary health verdict & speed summary">
            <span class="metric-item-title">Executive Verdict</span>
            <span class="metric-item-subtitle" id="subVerdict">1-Sec Health &amp; Speed</span>
          </button>

          <!-- Metric 2: Latency Percentiles & SLA -->
          <button class="btn-metric-item latency" data-metric="latency" title="Tail latency percentiles Min to Max and SLA overlay">
            <span class="metric-item-title">Latency Percentiles</span>
            <span class="metric-item-subtitle" id="subLatency">p50 - p99 &amp; SLA Overlay</span>
          </button>

          <!-- Metric 3: Engine Telemetry (Cycles / Waterfall / Scope) -->
          <button class="btn-metric-item telemetry" data-metric="telemetry" title="Load cycles breakdown, sequence workflow steps, or fuzzing scope">
            <span class="metric-item-title">Engine Telemetry</span>
            <span class="metric-item-subtitle" id="subTelemetry">Cycles / Workflow Steps</span>
          </button>

          <!-- Metric 4: Diagnostics & Error Triage -->
          <button class="btn-metric-item diagnostics" data-metric="diagnostics" title="Inspect failed requests, status code pills, and payloads">
            <span class="metric-item-title">Diagnostics &amp; Errors</span>
            <span class="metric-item-subtitle" id="subDiagnostics">Status Code Distribution</span>
          </button>
        </div>

        <!-- Metric Purpose / Help Notice Card -->
        <div id="metricNoticeCard" class="metric-notice-box">
          <div class="metric-notice-header">
            <span id="metricNoticeTitle" class="metric-notice-pill">NOTICE</span>
            <button id="btnDismissMetricNotice" class="metric-notice-close" title="Dismiss notice" aria-label="Dismiss">&times;</button>
          </div>
          <div id="metricNoticeBody" class="metric-notice-body">
            <!-- Dynamic explanation of why this metric matters -->
          </div>
        </div>
      </aside>

    </main>

  </div>

  <!-- Mounting Container for Notice, Error, and Success Info Boxes -->
  <div id="infoBoxContainer"></div>

  <script src="js/global.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
